<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Correction de mots</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    mark {
      background-color: yellow;
    }
  </style>
</head>
<body class="container mt-5">

  <h2 class="mb-4">Mot: "{{ mot }}" non trouvé</h2>

  <p class="fs-5">
    {{ ligne.replace(mot, '<mark>' ~ mot ~ '</mark>') | safe }}
  </p>

  <div class="row">
    <!-- Colonne 1 -->
    <div class="col-md-4 text-center">
      <form id="form-add" method="post" action="/add">
        <input type="hidden" name="mot" value="{{ mot }}">
        <button type="submit" class="btn btn-outline-primary w-100 mb-2 text-start">
          <span class="d-flex align-items-center gap-2">
            <span class="badge text-bg-primary">0</span>
            Ajouter au dictionnaire
          </span>
        </button>
      </form>
    </div>

    <!-- Colonne 2 -->
    <div class="col-md-4">
      <form id="form-correct" method="post" action="/correct">
        <input type="hidden" name="mot" value="{{ mot }}">
        {% if corrections %}
          {% for correction in corrections %}
            <button type="submit" name="correction" value="{{ correction }}" class="btn btn-outline-primary w-100 mb-2 text-start" id="btn-correction-{{ loop.index }}">
              <span class="d-flex align-items-center gap-2">
                <span class="badge text-bg-primary">{{ loop.index }}</span>
                {{ correction }}
              </span>
            </button>
          {% endfor %}
        {% else %}
          <button class="btn btn-secondary w-100 mb-2" disabled>Aucune correction proposée</button>
        {% endif %}
      </form>
    </div>

    <!-- Colonne 3 -->
    <div class="col-md-4">
      <form method="post" action="/correct">
        <input type="hidden" name="mot" value="{{ mot }}">
        <input type="text" name="correction" class="form-control mb-2" placeholder="Correction manuelle" autofocus>
        <button type="submit" class="btn btn-success w-100">Correction manuelle</button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('keydown', function(event) {
      const key = event.key;
      if (key === '0') {
        // Simule l'envoi du formulaire /add
        document.getElementById('form-add').submit();
      } else if (['1', '2', '3', '4', '5'].includes(key)) {
        const btn = document.getElementById(`btn-correction-${key}`);
        if (btn) {
          btn.click();
        }
      }
    });
  </script>

</body>
</html>
